<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQER Rush — Pixel Service Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div>
        <strong>SQER Rush</strong>
        <span>v1.1: рабочие клавиши + чистый интерфейс</span>
      </div>
      <div class="keys">Кликни по игре, если клавиши не работают · WASD/стрелки — ходить · E — взять/отдать · R — раннер</div>
    </header>
    <main class="game-shell">
      <canvas id="game" width="1448" height="1086" tabindex="0"></canvas>
    </main>
  </div>
  <script src="game.js"></script>
</body>
</html>
